backend:
  name: git-gateway
  branch: main

media_folder: "uploads"
public_folder: "/uploads"

collections:
  - name: "properties"
    label: "Properties"
    folder: "content/properties"
    create: true
    slug: "{{slug}}"
    fields:
      - label: "Property Name"
        name: "title"
        widget: "string"
      - label: "Slug"
        name: "slug"
        widget: "string"
      - label: "Price"
        name: "price"
        widget: "string"
      - label: "Location"
        name: "location"
        widget: "string"
      - label: "Country"
        name: "country"
        widget: "select"
        options: ["United States", "Mexico", "Costa Rica", "Nicaragua"]
      - label: "Bedrooms"
        name: "beds"
        widget: "string"
      - label: "Bathrooms"
        name: "baths"
        widget: "string"
      - label: "Size"
        name: "size"
        widget: "string"
      - label: "Badge"
        name: "badge"
        widget: "select"
        options: ["FOR SALE", "COMING SOON", "UNDER CONTRACT", "SOLD"]
        default: "FOR SALE"
      - label: "Featured Image"
        name: "image"
        widget: "image"
      - label: "Gallery Images"
        name: "gallery"
        widget: "list"
        required: false
        field: 
          label: "Image"
          name: "image"
          widget: "image"
      - label: "Short Description"
        name: "excerpt"
        widget: "text"
      - label: "Full Description"
        name: "body"
        widget: "markdown"
      - label: "Amenities"
        name: "amenities"
        widget: "string"
      - label: "Featured on Homepage?"
        name: "featured"
        widget: "boolean"
        default: true
