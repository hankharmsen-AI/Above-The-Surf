backend:
  name: git-gateway
  branch: main

media_folder: "Above the surf website/Pictures"
public_folder: "/Pictures"

collections:
  - name: "properties"
    label: "Properties"
    folder: "Above the surf website/content/properties"
    create: true
    slug: "{{slug}}"
    fields:
      - label: "Property Name"
        name: "title"
        widget: "string"
      - label: "Slug (Auto-generated)"
        name: "slug"
        widget: "string"
      - label: "Price"
        name: "price"
        widget: "string"
      - label: "Location"
        name: "location"
        widget: "string"
      - label: "Country"
        name: "country"
        widget: "select"
        options: ["United States", "Mexico", "Costa Rica", "Nicaragua"]
      - label: "Bedrooms"
        name: "beds"
        widget: "string"
      - label: "Bathrooms"
        name: "baths"
        widget: "string"
      - label: "Size"
        name: "size"
        widget: "string"
      - label: "Badge"
        name: "badge"
        widget: "select"
        options: ["FOR SALE", "VACATION RENTAL", "COMING SOON", "UNDER CONTRACT", "SOLD"]
        default: "FOR SALE"
      - label: "Latitude (e.g. 21.87)"
        name: "lat"
        widget: "string"
        required: false
      - label: "Longitude (e.g. -159.46)"
        name: "lng"
        widget: "string"
        required: false
      - label: "Featured Image"
        name: "image"
        widget: "image"
      - label: "Surf Score (Overall 0-10)"
        name: "surf_score"
        widget: "string"
        default: "9.0 / 10"
      - label: "Average Wave Height"
        name: "wave_height"
        widget: "string"
        default: "4-6 ft"
      - label: "Water Temperature"
        name: "water_temp"
        widget: "string"
        default: "78°F / Boardshorts"
      - label: "Wave Consistency"
        name: "consistency"
        widget: "string"
        default: "85% year-round"
      - label: "Break Type"
        name: "break_type"
        widget: "select"
        options: ["Point Break", "Reef Break", "Beach Break", "Multiple Types"]
        default: "Point Break"
      - label: "Crowd Level"
        name: "crowd_level"
        widget: "select"
        options: ["Low", "Medium", "Heavy"]
        default: "Medium"
      - label: "Gallery Images"
        name: "gallery"
        widget: "list"
        required: false
        field: 
          label: "Image"
          name: "image"
          widget: "image"
      - label: "Short Description"
        name: "excerpt"
        widget: "text"
      - label: "Full Description"
        name: "body"
        widget: "markdown"
      - label: "Amenities"
        name: "amenities"
        widget: "string"
      - label: "Featured on Homepage?"
        name: "featured"
        widget: "boolean"
        default: true

